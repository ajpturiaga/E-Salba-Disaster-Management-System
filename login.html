<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | E-Salba</title>
    <link rel="icon" type="image/png" href="Assets/ESalbaIcon.png">
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body class="auth-page">


<div class="auth-container">


    <div class="auth-visual">

        <!-- Header Logo -->
<a href="index.html" class="logo footer-logo">
    <img src="Assets/SystemLogo.png" alt="E-Salba Logo" class="logo-img">
</a>


        <div class="auth-visual-content">

            <img src="Assets/NoBGLogo.png" alt="E-Salba System Logo" class="auth-main-image">

            <p>
                Sign in to access your E-Salba account,
                emergency alerts, assignments, and messages.
            </p>

        </div>


        <div class="auth-decoration"></div>

    </div>


    <div class="auth-form-container">

        <div class="auth-form-box">

            <a href="index.html" class="mobile-auth-logo">

                <span class="logo-icon">
                    <i class="fa-solid fa-shield-heart"></i>
                </span>

                <strong>E-Salba</strong>

            </a>


            <div class="auth-heading">

                <span class="section-tag">
                    WELCOME BACK
                </span>

                <h2>
                    Sign in to
                    <span>your account.</span>
                </h2>

                <p>
                    Enter your account information below.
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label>
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <div class="label-row">

                        <label>
                            Password
                        </label>

                        <a href="#">
                            Forgot password?
                        </a>

                    </div>


                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="loginPassword"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>

                    </div>

                </div>


                <label class="checkbox-label">

                    <input type="checkbox">

                    <span>
                        Remember me
                    </span>

                </label>


                <button type="submit"
                        class="btn btn-primary full-width">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Sign In

                </button>

            </form>


            <div class="auth-divider">
                <span>OR</span>
            </div>


            <p class="auth-switch">

                Don't have an account?

                <a href="register.html">
                    Create one
                </a>

            </p>


            <a href="index.html" class="back-home">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Home

            </a>

        </div>

    </div>

</div>


<script src="js/script.js"></script>

</body>
</html>
